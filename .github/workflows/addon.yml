name: Build and Publish HA Add-on

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-addon:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, aarch64]
        include:
          - arch: amd64
            ha_arch: amd64
            base_image: "ghcr.io/hassio-addons/debian-base/amd64:9.3.0"
            platforms: linux/amd64
          - arch: aarch64
            ha_arch: aarch64
            base_image: "ghcr.io/hassio-addons/debian-base/aarch64:9.3.0"
            platforms: linux/arm64

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compute image base (owner-scoped, fork-friendly)
        id: image
        # Derive the GHCR namespace from the repository owner so forks publish
        # to their own packages instead of the upstream namespace. The canonical
        # repo (owner "martinhoefling") is unaffected. GHCR requires lowercase.
        run: |
          OWNER="${{ github.repository_owner }}"
          echo "base=${REGISTRY}/${OWNER,,}/spectrum-knx-addon" >> "$GITHUB_OUTPUT"

      - name: Determine the Add-on version to build
        id: addon_version
        # Every add-on slug (stable and beta) pulls the same image and pins it by
        # version, so the image tag to build is simply the version being released.
        # On a tag push that is the tag; on main it is the beta channel's version,
        # which is the one that moves ahead (#427). Older versions referenced by
        # the stable slugs were built when they were current.
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep '^version:' ha-addon-beta/config.yaml | sed 's/version: *"\(.*\)"/\1/')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Add-on version: $VERSION"

      - name: Compute image tags
        id: tags
        # Never move ":latest" onto a pre-release build (#427) — a semver
        # pre-release version carries a hyphen ("2.0.0-beta.7"). Supervisor pulls
        # the pinned version tag, so ":latest" is only a convenience.
        run: |
          BASE="${{ steps.image.outputs.base }}-${{ matrix.ha_arch }}"
          VERSION="${{ steps.addon_version.outputs.version }}"
          {
            echo "tags<<TAGS_EOF"
            echo "$BASE:$VERSION"
            if [[ "$VERSION" != *-* ]]; then echo "$BASE:latest"; fi
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image tag already exists
        id: check_tag
        run: |
          IMAGE="${{ steps.image.outputs.base }}-${{ matrix.ha_arch }}:${{ steps.addon_version.outputs.version }}"
          # Only skip on main branch pushes to allow manual runs/tag releases to overwrite if needed
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] && docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image $IMAGE already exists in registry. Skipping build/push on main to prevent overwrite."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        if: steps.check_tag.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ha-addon/Dockerfile
          platforms: ${{ matrix.platforms }}
          build-args: |
            BUILD_FROM=${{ matrix.base_image }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
