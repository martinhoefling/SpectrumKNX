services:
  # Development-specific overrides for the backend
  backend:
    build:
      context: ./backend
    # Always build the local backend: the base file pulls the release image
    # (pull_policy: always, #427), whose packages may not match the mounted
    # source (#535). Its own tag keeps the build from shadowing ":latest".
    image: spectrumknx-backend:dev
    pull_policy: build
    volumes:
      - ./project:/project
      - ./backend:/app
    environment:
      - APP_VERSION=${APP_VERSION:-dev}

  # The frontend service is only needed in development (Vite HMR)
  frontend:
    build:
      context: ./frontend
    container_name: knx_frontend
    environment:
      - VITE_BACKEND_URL=http://backend:8765
      - VITE_APP_VERSION=${APP_VERSION:-dev}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
