# Beta channel (#427). Same image as the stable add-on, pinned to a
# pre-release version. Install this one *instead of* the stable add-on —
# running both against the same bus is not supported.
name: "Spectrum KNX (HA Companion, Beta)"
description: "BETA — KNX analyzer UI on top of Home Assistant's own KNX telegram history — no second bus connection, no separate database"
version: "2.0.0-beta.7"
slug: "spectrum_knx_companion_beta"
image: "ghcr.io/martinhoefling/spectrum-knx-addon-{arch}"
init: false
arch:
  - aarch64
  - amd64
ingress: true
ingress_port: 8765
ingress_stream: true
panel_icon: mdi:database-eye
panel_title: "Spectrum KNX (HA) Beta"
panel_admin: true
# Read HA's KNX telegram database (rw mount: sqlite WAL/locking needs a writable
# directory even though the database itself is opened read-only)
map:
  - homeassistant_config:rw
# Access to the core websocket API for the live telegram bridge
homeassistant_api: true
options:
  COMPANION_MODE: true
  LIVE_SOURCE: "ha_websocket"
  TELEGRAM_DB_PATH: ""
  LOG_LEVEL: "INFO"
  UPDATE_CHECK: true
schema:
  COMPANION_MODE: "bool"
  LIVE_SOURCE: "list(ha_websocket|poll|none)"
  TELEGRAM_DB_PATH: "str?"
  LOG_LEVEL: "list(DEBUG|INFO|WARNING|ERROR|CRITICAL)"
  UPDATE_CHECK: "bool"
