[project]
name = "spectrum-knx"
# Placeholder — release versions come from the git tag (APP_VERSION at runtime,
# injected by the packaging pipelines). The backend is not published to PyPI.
version = "0.0.0"
description = "A professional KNX bus monitor and analyzer"
readme = "../README.md"
license = "MIT"
requires-python = ">=3.12"
# Direct runtime dependencies. requirements.txt is the pinned lock (including
# transitive deps) used by the Docker image and the HA add-on — keep both in
# sync when adding a dependency.
dependencies = [
    "aiosqlite",
    "asyncpg",
    "fastapi",
    "httpx",
    # Git pin for the unreleased MCP tools; revert to ">=0.11.0" once on PyPI.
    "knx-telegram-store @ git+https://github.com/XKNX/knx-telegram-store.git@ed484ad4958ccbd971374827baefeff517022aca",
    "mcp",
    "pydantic",
    "python-dotenv",
    "python-multipart",
    "SQLAlchemy",
    "uvicorn",
    "websockets",
    # Git pins for the unreleased MCP tools (xknx.mcp / xknxproject.mcp).
    # xknx tracks upstream main (XKNX/xknx#1876/#1880 merged); xknxproject stays on
    # the fork branch until XKNX/xknxproject#625 merges. Revert both to
    # "xknx"/"xknxproject" once released to PyPI.
    "xknx @ git+https://github.com/XKNX/xknx.git@678f2eac302c1a2a8b1a2ec1b13adaeb78c8358f",
    "xknxproject @ git+https://github.com/martinhoefling/xknxproject.git@aba891dae69d9b14227e8565e811b317ed0dabb7",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.ruff]
# Target Python version (minimum supported, see requires-python)
target-version = "py312"
# Max line length for auto-format or other rules
line-length = 120
# Exclude common directories
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "dist",
]

[tool.ruff.lint]
# Standard linting rules
select = ["E", "F", "B", "I", "U", "UP"]
ignore = [
    "E501", # Line too long (Relaxed for long URLs and comments)
    "B008", # Do not perform function call `Depends` in argument defaults (Standard FastAPI pattern)
]

[tool.ruff.lint.mccabe]
max-complexity = 15
