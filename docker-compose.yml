services:
  db:
    # Changing this major version under an existing knx_db_data volume will stop
    # the container from starting — the data directory belongs to the old major.
    # See DEPLOYMENT.md "PostgreSQL Major Versions & Upgrades" (#432).
    image: timescale/timescaledb:latest-pg15
    container_name: knx_timescale
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knxuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knxpassword}
      POSTGRES_DB: ${POSTGRES_DB:-knx_analyzer}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - knx_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    image: ${APP_IMAGE:-ghcr.io/martinhoefling/spectrumknx:latest}
    # Re-pull on every "up" so a moved tag (":latest") actually updates the
    # container instead of silently reusing the cached local image (#427).
    pull_policy: always
    container_name: knx_backend
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-knxuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-knxpassword}
      - POSTGRES_DB=${POSTGRES_DB:-knx_analyzer}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - BIND_HOST=${BIND_HOST:-0.0.0.0}
      - BIND_PORT=${BIND_PORT:-8765}
    env_file:
      - .env
    volumes:
      - knx_project_data:/project
    ports:
      - "${BIND_PORT:-8765}:${BIND_PORT:-8765}"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  knx_db_data:
  knx_project_data:
